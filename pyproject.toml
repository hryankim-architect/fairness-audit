[project]
name = "fairness-audit"
version = "0.2.0"
description = "Clean-room group-fairness audit: per-group selection-rate / TPR / FPR, demographic-parity and equalized-odds gaps with bootstrap CIs, and three mitigations (demographic-parity thresholds, equal-opportunity thresholds, per-group calibration) that surface the metric conflict and the fairness/accuracy trade-off. Synthetic cohort with a tunable disparity; the methodology is the deliverable."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "H. Ryan Kim" }]
requires-python = ">=3.11"
dependencies = []  # pure standard library: hashlib, random, json, dataclasses

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # run tests from a fresh clone (no editable install needed)
